name: Build and publish release

on:
  push:
    tags:
      - "*.*.*"
      - "!*-*"

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  reproducible:
    uses: ./.github/workflows/reproducible.yml

  publish:
    needs: [reproducible, build]
    uses: ./.github/workflows/publisher.yml
    permissions:
      actions: read
      contents: write
